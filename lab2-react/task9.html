<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Важная строка! Добавляем всегда в своём проекте -->
    <title>Форма — вариант 03</title>
</head>
<body>

<form action="/submit" method="POST">

    <!-- --- Лёгкий уровень --- -->

    <!-- TODO 1: Поле имени
         label с текстом "Имя" (for="name") + input type="text"
         с id="name" и name="name", атрибутом required. -->
    <label for="name">Имя</label>
    <input type="text" id="name" name="name" required>

    <!-- --- Средний уровень --- -->

    <!-- TODO 2: Поле email
         label "Email" (for="email") + input type="email" с
         id="email", name="email", required, и placeholder
         "you@example.com". -->
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required placeholder="you@example.com">

    <!-- TODO 3: Поле возраста
         label "Возраст" (for="age") + input type="number" с
         id="age", name="age", min="15", max="63". -->
    <label for="age">Возраст</label>
    <input type="number" id="age" name="age" min="15" max="63">

    <!-- --- Сложный уровень --- -->

    <!-- TODO 4: Radio-группа
         Три radio-кнопки для выбора тарифа — "Базовый", "Стандарт",
         "Премиум". У всех трёх должен быть ОДИНАКОВЫЙ name="plan" и
         РАЗНЫЕ value (basic / standard / premium), чтобы выбрать
         можно было только один вариант. У каждой — свой уникальный
         id, и подпись через label с for, указывающим на этот id. -->
    <div>
        <input type="radio" id="plan_basic" name="plan" value="basic">
        <label for="plan_basic">Базовый</label>

        <input type="radio" id="plan_standard" name="plan" value="standard">
        <label for="plan_standard">Стандарт</label>

        <input type="radio" id="plan_premium" name="plan" value="premium">
        <label for="plan_premium">Премиум</label>
    </div>

    <!-- TODO 5: Выпадающий список
         select с name="city" и минимум 3 вариантами городов внутри
         option (например: Казань, Пермь, Ярославль). -->
    <label for="city">Город:</label>
    <select id="city" name="city">
        <option value="kazan">Казань</option>
        <option value="perm">Пермь</option>
        <option value="yaroslavl">Ярославль</option>
    </select>

    <!-- --- Задача уровня "найди ошибку" --- -->

    <!-- TODO 6: Кнопка с ошибкой
         Ниже — кнопка с ошибкой, которая не отправляет форму.
         Исправьте так, чтобы клик по ней реально отправлял форму. -->
    <input type="submit" value="Отправить">

</form>

</body>
</html>
