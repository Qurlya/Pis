<!DOCTYPE html>
<html lang="ru">
<head>

  <title>Зоомагазин «Лапки»</title>
  <style>

    #toast { background: #333; color: #fff; padding: 10px 16px; border-radius: 6px; margin-top: 10px; }

  <hr>

  <div id="countdown">10</div>
  <button id="start-btn">Старт</button>
  <button id="stop-btn">Стоп</button>

  <!-- Подключаем свой JS-файл именно ПОСЛЕ разметки (внизу body) -->
