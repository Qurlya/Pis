<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Важная строка! Добавляем всегда в своём проекте -->
  <title>Зоомагазин «Лапки»</title>
  <style>
    #error-message { color: red; }
  </style>
</head>
<body>

  <h1>Зоомагазин «Лапки» — регистрация</h1>

  <form id="reg-form">
    <div>
      <input type="text" id="username-field" placeholder="Ваше имя">
    </div>
    <div>
      <label><input type="checkbox" id="agree-checkbox"> Согласен с условиями</label>
    </div>
    <fieldset>
      <legend>Тип аккаунта</legend>
      <label><input type="radio" name="account-type" value="personal" checked> Личный</label>
      <label><input type="radio" name="account-type" value="business"> Бизнес</label>
    </fieldset>
    <div>
      <select id="country-select">
        <option value="ru">Россия</option>
        <option value="by">Беларусь</option>
        <option value="kz">Казахстан</option>
      </select>
    </div>
    <button type="submit">Зарегистрироваться</button>
  </form>

  <div id="error-message"></div>
  <div id="result"></div>

  <!-- Подключаем свой JS-файл именно ПОСЛЕ разметки (внизу body) -->
  <!-- Важная строка! Если подключить <script> выше разметки, элементы ещё не -->
  <!-- будут существовать в момент выполнения скрипта, и querySelector найдёт null -->
  <script src="var03.js"></script>
</body>
</html>
